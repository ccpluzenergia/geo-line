<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Geo-Línea AT</title>
<script>(function(){var t;try{t=localStorage.getItem("geolinea-tema")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b1316;--panel:#111c20;--rule:#2d424a;--fg:#dbe6e8;--muted:#8aa0a6;--sel:#ffc94a;--crit:#ff5d5d;
  --kv220:#ff6b52;--kv66:#b894ff;--kv60:#41c3e2}
:root[data-theme="light"]{color-scheme:light;--bg:#edf1f2;--panel:#ffffff;--rule:#c1ced2;--fg:#13232a;--muted:#4f636a;--sel:#b87c00;--crit:#d23232;--kv220:#d83b20;--kv66:#7f52e6;--kv60:#0987ad}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:28px 24px;display:grid;gap:14px}
h1{margin:0;font:700 30px "Barlow Semi Condensed","Arial Narrow",sans-serif}
h1 b{color:var(--sel)}
.kv{display:flex;gap:6px}.kv i{height:3px;flex:1;border-radius:2px}
p{margin:0;color:var(--muted);font-size:13.5px}
label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
input[type=password]{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;color:var(--fg);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.rem{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
button{background:var(--sel);color:#1b1400;border:0;border-radius:6px;padding:10px;font:600 16px "Barlow Semi Condensed",sans-serif;letter-spacing:.03em;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:13.5px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Geo-Línea <b>AT</b></h1>

</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = 'geolinea-k-' + P.salt.slice(0, 8);
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open_(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function saved() {
  let raw = null;
  try { raw = sessionStorage.getItem(KEY_STORE) || localStorage.getItem(KEY_STORE); } catch (e) {}
  if (!raw) return;
  try { await open_(await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', true, ['decrypt'])); }
  catch (e) { try { sessionStorage.removeItem(KEY_STORE); localStorage.removeItem(KEY_STORE); } catch (x) {} }
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Verificando…'; err.textContent = '';
  try {
    const key = await keyFrom(document.getElementById('pw').value);
    const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))));
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data)); // valida la contraseña
    try { sessionStorage.setItem(KEY_STORE, raw); if (document.getElementById('rem').checked) localStorage.setItem(KEY_STORE, raw); } catch (x) {}
    await open_(key);
  } catch (x) {
    err.textContent = 'Contraseña incorrecta. Vuelve a intentarlo.';
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
};
saved();
</script>
